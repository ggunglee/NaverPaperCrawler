name: Telegram Feedback

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      remind_if_empty:
        description: "Send reminder if no feedback has been collected today"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # 02:00 UTC is 11:00 KST. Remind if no feedback has arrived yet.
    - cron: "0 2 * * *"
    # 03:00 UTC is 12:00 KST. Feedback is checked once after the morning report cycle.
    - cron: "0 3 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore runtime data cache
        uses: actions/cache@v4
        with:
          path: ~/.naver_news_crawler
          key: naver-news-runtime-${{ github.run_id }}
          restore-keys: |
            naver-news-runtime-

      - name: Prune old runtime caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          try:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "cache",
                      "list",
                      "--key",
                      "naver-news-runtime-",
                      "--limit",
                      "100",
                      "--json",
                      "id,key,createdAt",
                  ],
                  text=True,
                  stderr=subprocess.STDOUT,
              )
          except subprocess.CalledProcessError as exc:
              print("runtime_cache_prune_skipped=1")
              print(exc.output)
              raise SystemExit(0)
          caches = json.loads(raw)
          caches.sort(key=lambda item: item["createdAt"], reverse=True)
          for cache in caches[5:]:
              subprocess.run(["gh", "cache", "delete", str(cache["id"])], check=False)
          print(f"runtime_caches_seen={len(caches)} runtime_caches_deleted={max(0, len(caches) - 5)}")
          PY

      - name: Collect Telegram feedback
        run: |
          REMINDER_FLAG=""
          if [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            REMINDER_FLAG="--remind-if-empty"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.remind_if_empty }}" = "true" ]; then
            REMINDER_FLAG="--remind-if-empty"
          fi
          python telegram_feedback.py --json-out qa/telegram_feedback.json $REMINDER_FLAG

      - name: Review feedback against draft report
        run: |
          python feedback_review.py --feedback-json qa/telegram_feedback.json --report-date today --json-out qa/feedback_review.json

      - name: Prune runtime data
        if: always()
        run: |
          python cleanup_runtime_data.py --days 30

      - name: Upload feedback artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-feedback-${{ github.run_id }}
          path: |
            ~/.naver_news_crawler/data/telegram_feedback.db
            ~/.naver_news_crawler/feedback/*.json
            qa/telegram_feedback.json
            qa/feedback_review.json
          if-no-files-found: warn
          retention-days: 30
