name: Morning Report

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 21:07 UTC is 06:07 KST.
    # A few minutes after the hour avoids the busiest scheduler minute.
    - cron: "7 21 * * *"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-report.txt

      - name: Generate and send Telegram morning report
        run: |
          python morning_report_task.py --date today --send-telegram --force --no-llm
