name: Morning Report

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send the generated report to Telegram"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      mode:
        description: "Report mode"
        required: true
        default: "initial"
        type: choice
        options:
          - "initial"
          - "update"
  schedule:
    # GitHub cron uses UTC. 20:07 UTC is 05:07 KST.
    # A few minutes after the hour avoids the busiest scheduler minute.
    - cron: "7 20 * * *"
    # 21:55 UTC is 06:55 KST. This checks online-only follow-up stories from 06:00 to 06:50.
    - cron: "55 21 * * *"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
      TELEGRAM_GROUP_ONLY: ${{ vars.TELEGRAM_GROUP_ONLY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID || vars.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET || vars.NAVER_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID || vars.GOOGLE_SHEETS_SPREADSHEET_ID }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Drive restore dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth requests

      - name: Restore runtime data cache
        uses: actions/cache@v4
        with:
          path: ~/.naver_news_crawler
          key: naver-news-runtime-${{ github.run_id }}
          restore-keys: |
            naver-news-runtime-

      - name: Restore runtime data from Google Drive
        id: drive_restore
        continue-on-error: true
        run: |
          python backup_runtime_data.py --restore --skip-if-unconfigured

      - name: Prune old runtime caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          try:
              raw = subprocess.check_output(
                  [
                      "gh",
                      "cache",
                      "list",
                      "--key",
                      "naver-news-runtime-",
                      "--limit",
                      "100",
                      "--json",
                      "id,key,createdAt",
                  ],
                  text=True,
                  stderr=subprocess.STDOUT,
              )
          except subprocess.CalledProcessError as exc:
              print("runtime_cache_prune_skipped=1")
              print(exc.output)
              raise SystemExit(0)
          caches = json.loads(raw)
          caches.sort(key=lambda item: item["createdAt"], reverse=True)
          for cache in caches[5:]:
              subprocess.run(["gh", "cache", "delete", str(cache["id"])], check=False)
          print(f"runtime_caches_seen={len(caches)} runtime_caches_deleted={max(0, len(caches) - 5)}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-report.txt

      - name: Generate morning report
        id: generate
        run: |
          SEND_FLAG="--send-telegram"
          MODE="initial"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_telegram }}" = "false" ]; then
            SEND_FLAG=""
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "55 21 * * *" ]; then
            MODE="update"
          fi
          EXTRA_FLAGS="--force"
          FEEDBACK_FLAG=""
          if [ "$MODE" = "update" ]; then
            EXTRA_FLAGS=""
            FEEDBACK_FLAG="--send-feedback-guide"
          fi
          python morning_report_task.py --date today --mode "$MODE" $SEND_FLAG $FEEDBACK_FLAG $EXTRA_FLAGS --no-llm
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Summarize generated report
        id: summarize
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          report_dir = Path.home() / ".naver_news_crawler" / "reports"
          report_mode = os.environ.get("REPORT_MODE") or ""
          preferred = sorted(report_dir.glob(f"*_{report_mode}_morning_report.md")) if report_mode else []
          reports = preferred or sorted(report_dir.glob("*_morning_report.md"))
          if not reports:
              print("No report file found.")
              raise SystemExit(0)
          path = reports[-1]
          qa_path = Path("qa") / f"{path.stem}_qa.json"
          import subprocess, sys
          subprocess.run(
              [sys.executable, "report_qa.py", str(path), "--json-out", str(qa_path), "--fail-on-error"],
              check=True,
          )
          text = path.read_text(encoding="utf-8")
          selected = sum(1 for line in text.splitlines() if line.startswith("※"))
          forbidden = [term for term in ["데일리메일", "생활법률", "상담소", "사연자", "동일 사안 1.00"] if term in text]
          qa = qa_path.read_text(encoding="utf-8") if qa_path.exists() else "{}"
          summary = [
              "## Morning report artifact",
              "",
              f"- Report file: `{path.name}`",
              f"- Characters: `{len(text)}`",
              f"- Selected items: `{selected}`",
              f"- Forbidden terms found: `{', '.join(forbidden) if forbidden else 'none'}`",
              "",
              "### QA JSON",
              "",
              "```json",
              qa.strip(),
              "```",
          ]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(summary) + "\n", encoding="utf-8")
          print("\n".join(summary))
          PY
        env:
          REPORT_MODE: ${{ steps.generate.outputs.mode }}

      - name: Prune runtime data
        if: always()
        run: |
          python cleanup_runtime_data.py --days 30

      - name: Mirror report data to Google Sheets
        if: always()
        continue-on-error: true
        run: |
          python google_sheets_mirror.py --date today --skip-if-unconfigured

      - name: Back up runtime data to Google Drive
        id: drive_backup
        if: always()
        continue-on-error: true
        run: |
          python backup_runtime_data.py --skip-if-unconfigured --keep 14

      - name: Alert operational issue
        if: >-
          ${{
            always() &&
            (steps.drive_restore.outcome == 'failure' ||
             steps.generate.outcome == 'failure' ||
             steps.summarize.outcome == 'failure' ||
             steps.drive_backup.outcome == 'failure') &&
            (github.event_name != 'workflow_dispatch' || inputs.send_telegram == 'true')
          }}
        run: |
          python notify_telegram.py \
            --title "[아침보고 오류 알림]" \
            --message "GitHub Actions 실행 중 점검이 필요한 단계가 있습니다.
          - Drive 복원: ${{ steps.drive_restore.outcome }}
          - 보고 생성: ${{ steps.generate.outcome }}
          - QA 요약: ${{ steps.summarize.outcome }}
          - Drive 백업: ${{ steps.drive_backup.outcome }}
          - 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-report-${{ github.run_id }}
          path: |
            ~/.naver_news_crawler/reports/*_morning_report.md
            ~/.naver_news_crawler/data/*.db
            ~/.naver_news_crawler/logs/*.log
            ~/.naver_news_crawler/config.json
            ~/.naver_news_crawler/feedback_rules.json
            ~/.naver_news_crawler/feedback_review_state.json
            qa/*.json
          if-no-files-found: warn
          retention-days: 14
