name: Morning Report

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send the generated report to Telegram"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      mode:
        description: "Report mode"
        required: true
        default: "initial"
        type: choice
        options:
          - "initial"
          - "update"
  schedule:
    # GitHub cron uses UTC. 21:07 UTC is 06:07 KST.
    # A few minutes after the hour avoids the busiest scheduler minute.
    - cron: "7 21 * * *"
    # 22:55 UTC is 07:55 KST. This checks online-only follow-up stories from 06:00 to 07:50.
    - cron: "55 22 * * *"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-report.txt

      - name: Generate morning report
        run: |
          SEND_FLAG="--send-telegram"
          MODE="initial"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_telegram }}" = "false" ]; then
            SEND_FLAG=""
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "55 22 * * *" ]; then
            MODE="update"
          fi
          EXTRA_FLAGS="--force"
          FEEDBACK_FLAG=""
          if [ "$MODE" = "update" ]; then
            EXTRA_FLAGS=""
            FEEDBACK_FLAG="--send-feedback-guide"
          fi
          python morning_report_task.py --date today --mode "$MODE" $SEND_FLAG $FEEDBACK_FLAG $EXTRA_FLAGS --no-llm

      - name: Summarize generated report
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          report_dir = Path.home() / ".naver_news_crawler" / "reports"
          reports = sorted(report_dir.glob("*_morning_report.md"))
          if not reports:
              print("No report file found.")
              raise SystemExit(0)
          path = reports[-1]
          qa_path = Path("qa") / f"{path.stem}_qa.json"
          import subprocess, sys
          subprocess.run(
              [sys.executable, "report_qa.py", str(path), "--json-out", str(qa_path), "--fail-on-error"],
              check=True,
          )
          text = path.read_text(encoding="utf-8")
          selected = sum(1 for line in text.splitlines() if line.startswith("※"))
          forbidden = [term for term in ["데일리메일", "생활법률", "상담소", "사연자", "동일 사안 1.00"] if term in text]
          qa = qa_path.read_text(encoding="utf-8") if qa_path.exists() else "{}"
          summary = [
              "## Morning report artifact",
              "",
              f"- Report file: `{path.name}`",
              f"- Characters: `{len(text)}`",
              f"- Selected items: `{selected}`",
              f"- Forbidden terms found: `{', '.join(forbidden) if forbidden else 'none'}`",
              "",
              "### QA JSON",
              "",
              "```json",
              qa.strip(),
              "```",
          ]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(summary) + "\n", encoding="utf-8")
          print("\n".join(summary))
          PY

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-report-${{ github.run_id }}
          path: |
            ~/.naver_news_crawler/reports/*_morning_report.md
            ~/.naver_news_crawler/data/*.db
            ~/.naver_news_crawler/logs/*.log
            qa/*.json
          if-no-files-found: warn
          retention-days: 14
